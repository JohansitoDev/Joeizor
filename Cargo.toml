[package]
name = "joeizor-ui"
version = "0.1.0"
edition = "2024"
description = "Joeizor UI - Creado por Johan Antinio Mancebo Lebron"
license = "MIT"

[[bin]]
name = "jok-ui"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
pest = "2.8"
pest_derive = "2.8"
sha1 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventTarget", "History", "Node", "Window"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"
